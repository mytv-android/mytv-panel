<h2 mat-dialog-title>{{ 'EPG.CUSTOM_EPG' | translate }}</h2>
<mat-dialog-content>
  <div class="list-container" cdkDropList (cdkDropListDropped)="drop($event)">
    @for (source of sources; track source; let i = $index) {
      @let current = isCurrent(source);
      <div class="list-item select-row" cdkDrag [class.is-selected]="current">
        <div class="drag-handle" cdkDragHandle>
          <mat-icon>drag_indicator</mat-icon>
        </div>
        <button type="button" class="select-row-main item-content" [attr.aria-pressed]="current"
          (click)="setCurrent(source)">
          <span class="item-name">{{ source.name }}</span>
          <span class="select-row-desc">{{ source.url }}</span>
        </button>
        @if (current) {
          <mat-icon class="select-row-check">check_circle</mat-icon>
        }
        <div class="item-actions">
          <button mat-icon-button (click)="editSource(i, source)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteSource(i)">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </div>
    }
    @if (sources.length === 0) {
      <div class="empty-state">
        {{ 'LOG.NO_DATA' | translate }}
      </div>
    }
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="addSource()">
    <mat-icon>add</mat-icon>
    {{ 'HOME.PUSH' | translate }}
  </button>
  <span class="spacer"></span>
  <button mat-button (click)="onCancel()">{{ 'HOME.CLOSE' | translate }}</button>
  <button mat-flat-button color="primary" (click)="onSave()">{{ 'SYNC.UPDATE' | translate }}</button>
</mat-dialog-actions>
