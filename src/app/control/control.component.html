<app-settings-page label="TV.settings_category_control" summary="TV.settings_category_control_summary">

  <app-settings-section label="TV.settings_section_control_switch">
    <app-settings-row label="TV.ui_channel_list_loop" desc="TV.ui_channel_list_loop_desc">
      <mat-slide-toggle [(ngModel)]="c.iptvChannelChangeListLoop" (change)="save()"></mat-slide-toggle>
    </app-settings-row>

    <app-settings-row label="TV.ui_channel_change_cross_group" desc="TV.ui_channel_change_cross_group_desc">
      <mat-slide-toggle [(ngModel)]="c.iptvChannelChangeCrossGroup" (change)="save()"></mat-slide-toggle>
    </app-settings-row>
  </app-settings-section>

  <!-- App 在电视上只显示遥控器两节、在触屏设备上只显示全屏手势；网页面板全列出并标明 -->
  <app-settings-section label="TV.ui_control_group_key" surface="tv">
    @for (row of keys; track row.label) {
    <ng-container *ngTemplateOutlet="actionRow; context: { $implicit: row }" />
    }
  </app-settings-section>

  <app-settings-section label="TV.ui_control_group_long_key" surface="tv">
    @for (row of longKeys; track row.label) {
    <ng-container *ngTemplateOutlet="actionRow; context: { $implicit: row }" />
    }
  </app-settings-section>

  <app-settings-section label="TV.ui_control_group_swipe" surface="touch">
    @for (row of gestures; track row.label) {
    <ng-container *ngTemplateOutlet="actionRow; context: { $implicit: row }" />
    }
  </app-settings-section>
</app-settings-page>

<ng-template #actionRow let-row>
  <app-settings-row [label]="row.label" [desc]="row.desc ?? ''" [descParams]="{ p1: (row.key ?? '') | translate }">
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-select [ngModel]="$any(c)[row.field]" (ngModelChange)="setAction(row.field, $event)">
        @for (action of actions; track action) {
        <mat-option [value]="action">{{ actionLabels[action] | translate }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </app-settings-row>
</ng-template>
